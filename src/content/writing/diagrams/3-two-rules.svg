<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="Diagram: a multiple-choice checklist with one option ticked, and a three-rung escalation ladder ending at Claude Code">
  <title>Two rules: ask with buttons, escalate by size</title>
  <defs>
    <marker id="f3-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#cbd5e1"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

    <!-- panel A -->
    <rect x="20" y="20" width="344" height="380" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="40" y="50" font-size="13" font-weight="600" fill="#111827">Ask with buttons</text>
    <text x="40" y="69" font-size="10.5" fill="#6b7280">one question call &#183; multiple: true</text>

    <rect x="40" y="84" width="304" height="260" rx="12" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="56" y="112" font-size="11.5" font-weight="600" fill="#111827">T-087 is next in the queue.</text>

    <rect x="56" y="132" width="272" height="32" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="70" y="141" width="14" height="14" rx="4" fill="#2563eb"/>
    <polyline points="73,148 76,151.5 82,144" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="94" y="152" font-size="10.5" fill="#1e3a8a">Dispatch T-087 (recommended)</text>

    <rect x="56" y="172" width="272" height="32" rx="8" fill="#ffffff" stroke="#d1d5db"/>
    <rect x="70" y="181" width="14" height="14" rx="4" fill="#ffffff" stroke="#9ca3af"/>
    <text x="94" y="192" font-size="10.5" fill="#374151">Rotate the Worker secret</text>

    <rect x="56" y="212" width="272" height="32" rx="8" fill="#ffffff" stroke="#d1d5db"/>
    <rect x="70" y="221" width="14" height="14" rx="4" fill="#ffffff" stroke="#9ca3af"/>
    <text x="94" y="232" font-size="10.5" fill="#374151">Rotate the two tokens</text>

    <rect x="56" y="252" width="272" height="32" rx="8" fill="#ffffff" stroke="#d1d5db"/>
    <rect x="70" y="261" width="14" height="14" rx="4" fill="#ffffff" stroke="#9ca3af"/>
    <text x="94" y="272" font-size="10.5" fill="#374151">Delete the old host</text>

    <rect x="56" y="292" width="272" height="32" rx="8" fill="#ffffff" stroke="#d1d5db"/>
    <rect x="70" y="301" width="14" height="14" rx="4" fill="#ffffff" stroke="#9ca3af"/>
    <text x="94" y="312" font-size="10.5" fill="#374151">Chase the open questions</text>

    <text x="40" y="374" font-size="10" fill="#6b7280">four decisions, one tap, one written record</text>

    <!-- panel B -->
    <rect x="396" y="20" width="344" height="380" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="416" y="50" font-size="13" font-weight="600" fill="#111827">Escalate by size</text>
    <text x="416" y="69" font-size="10.5" fill="#6b7280">never re-run the same task</text>

    <rect x="416" y="88" width="304" height="76" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="432" y="110" font-size="9" letter-spacing="1.2" fill="#9ca3af">1 &#183; FITS ONE RUN</text>
    <text x="432" y="130" font-size="11" fill="#111827">one task, one branch, one PR</text>
    <text x="432" y="148" font-size="10.5" fill="#6b7280">&#8594; builder, 50 steps</text>

    <line x1="568" y1="166" x2="568" y2="182" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#f3-grey)"/>

    <rect x="416" y="184" width="304" height="76" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="432" y="206" font-size="9" letter-spacing="1.2" fill="#9ca3af">2 &#183; CAP HIT, WORK LEFT</text>
    <text x="432" y="226" font-size="11" fill="#111827">commits, pushes, says what is left</text>
    <text x="432" y="244" font-size="10.5" fill="#6b7280">&#8594; task marked blocked, handoff written</text>

    <line x1="568" y1="262" x2="568" y2="278" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#f3-grey)"/>

    <rect x="416" y="280" width="304" height="92" rx="12" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="432" y="302" font-size="9" letter-spacing="1.2" fill="#7c3aed">3 &#183; TOO BIG OR TOO DETAILED</text>
    <text x="432" y="322" font-size="11" fill="#4c1d95">Claude Code, own git worktree,</text>
    <text x="432" y="339" font-size="11" fill="#4c1d95">reading a written task file</text>
    <text x="432" y="357" font-size="10.5" fill="#6d28d9">&#8594; same reviewer, same merge gate</text>

    <text x="416" y="390" font-size="10" fill="#6b7280">a different worker, not a lower standard</text>
  </g>
</svg>
