<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" role="img" aria-label="Diagram comparing the orchestrator, builder and reviewer permissions and budgets, with a three-part merge gate">
  <title>The harness: three roles, three permission sets, one gate</title>
  <defs>
    <marker id="f2-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

    <!-- column 1: orchestrator -->
    <rect x="28" y="24" width="224" height="312" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
    <rect x="44" y="40" width="192" height="34" rx="8" fill="#eff6ff"/>
    <text x="58" y="62" font-size="13" font-weight="600" fill="#1d4ed8">Orchestrator</text>
    <text x="44" y="102" font-size="9" letter-spacing="1.2" fill="#9ca3af">MAY EDIT</text>
    <text x="44" y="119" font-size="11" fill="#111827">agent/* &#183; AGENTS.md</text>
    <text x="44" y="134" font-size="11" fill="#6b7280">.env.example, placeholders only</text>
    <text x="44" y="160" font-size="9" letter-spacing="1.2" fill="#9ca3af">MAY RUN</text>
    <text x="44" y="177" font-size="11" fill="#111827">git &#183; gh pr view &#183; gh pr diff</text>
    <text x="44" y="192" font-size="11" fill="#6b7280">dispatches builder and reviewer</text>
    <text x="44" y="218" font-size="9" letter-spacing="1.2" fill="#9ca3af">NEVER</text>
    <text x="44" y="235" font-size="11" fill="#111827">writes app code</text>
    <text x="44" y="250" font-size="11" fill="#6b7280">merges without a yes</text>
    <text x="44" y="276" font-size="9" letter-spacing="1.2" fill="#9ca3af">BUDGET</text>
    <text x="44" y="293" font-size="11" fill="#111827">no step cap</text>
    <text x="44" y="308" font-size="11" fill="#6b7280">context is the limit</text>

    <!-- column 2: builder -->
    <rect x="268" y="24" width="224" height="312" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
    <rect x="284" y="40" width="192" height="34" rx="8" fill="#f5f3ff"/>
    <text x="298" y="62" font-size="13" font-weight="600" fill="#6d28d9">Builder</text>
    <text x="284" y="102" font-size="9" letter-spacing="1.2" fill="#9ca3af">MAY EDIT</text>
    <text x="284" y="119" font-size="11" fill="#111827">src/** and config</text>
    <text x="284" y="134" font-size="11" fill="#6b7280">not .env, .github, agent/</text>
    <text x="284" y="160" font-size="9" letter-spacing="1.2" fill="#9ca3af">MAY RUN</text>
    <text x="284" y="177" font-size="11" fill="#111827">push feat/* &#183; gh pr create</text>
    <text x="284" y="192" font-size="11" fill="#6b7280">lint &#183; tsc &#183; build</text>
    <text x="284" y="218" font-size="9" letter-spacing="1.2" fill="#9ca3af">NEVER</text>
    <text x="284" y="235" font-size="11" fill="#111827">merges, or pushes main</text>
    <text x="284" y="250" font-size="11" fill="#6b7280">spawns another agent</text>
    <text x="284" y="276" font-size="9" letter-spacing="1.2" fill="#9ca3af">BUDGET</text>
    <text x="284" y="293" font-size="11" fill="#111827">50 steps &#183; about 300 lines</text>
    <text x="284" y="308" font-size="11" fill="#6b7280">commits at the cap</text>

    <!-- column 3: reviewer -->
    <rect x="508" y="24" width="224" height="312" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
    <rect x="524" y="40" width="192" height="34" rx="8" fill="#ecfdf5"/>
    <text x="538" y="62" font-size="13" font-weight="600" fill="#047857">Reviewer</text>
    <text x="524" y="102" font-size="9" letter-spacing="1.2" fill="#9ca3af">MAY EDIT</text>
    <text x="524" y="119" font-size="11" fill="#111827">nothing at all</text>
    <text x="524" y="134" font-size="11" fill="#6b7280">edit: deny</text>
    <text x="524" y="160" font-size="9" letter-spacing="1.2" fill="#9ca3af">MAY RUN</text>
    <text x="524" y="177" font-size="11" fill="#111827">gh pr diff &#183; gh pr review</text>
    <text x="524" y="192" font-size="11" fill="#6b7280">lint &#183; tsc &#183; read the code</text>
    <text x="524" y="218" font-size="9" letter-spacing="1.2" fill="#9ca3af">NEVER</text>
    <text x="524" y="235" font-size="11" fill="#111827">fixes what it finds</text>
    <text x="524" y="250" font-size="11" fill="#6b7280">fetches the web, spawns agents</text>
    <text x="524" y="276" font-size="9" letter-spacing="1.2" fill="#9ca3af">BUDGET</text>
    <text x="524" y="293" font-size="11" fill="#111827">16 steps</text>
    <text x="524" y="308" font-size="11" fill="#6b7280">posts a verdict before the deep pass</text>

    <!-- gate -->
    <rect x="28" y="360" width="704" height="76" rx="14" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="48" y="386" font-size="9.5" letter-spacing="1.2" fill="#6b7280">NOTHING MERGES WITHOUT ALL THREE</text>
    <rect x="48" y="396" width="200" height="28" rx="14" fill="#ffffff" stroke="#d1d5db"/>
    <text x="148" y="415" text-anchor="middle" font-size="11" fill="#374151">reviewer APPROVE</text>
    <line x1="252" y1="410" x2="272" y2="410" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#f2-grey)"/>
    <rect x="278" y="396" width="200" height="28" rx="14" fill="#ffffff" stroke="#d1d5db"/>
    <text x="378" y="415" text-anchor="middle" font-size="11" fill="#374151">CI green</text>
    <line x1="482" y1="410" x2="502" y2="410" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#f2-grey)"/>
    <rect x="508" y="396" width="204" height="28" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="610" y="415" text-anchor="middle" font-size="11" fill="#1d4ed8">your explicit yes</text>
  </g>
</svg>
