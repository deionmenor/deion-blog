<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="1520" height="960" role="img" aria-label="Three stacked layers: the surface, which a person reads and clicks; the harness, which makes it safe to be wrong; and the model, which is allowed to be wrong.">
  <title>Three layers, one of them visible</title>
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

    <!-- band A: the surface -->
    <rect x="20" y="20" width="720" height="98" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="40" y="47" font-size="9.5" letter-spacing="1.4" font-weight="600" fill="#9ca3af">THE SURFACE</text>
    <text x="720" y="47" text-anchor="end" font-size="10" fill="#6b7280">what a person reads and clicks</text>

    <rect x="40" y="64" width="129" height="34" rx="17" fill="#ffffff" stroke="#d1d5db"/>
    <text x="104" y="85" text-anchor="middle" font-size="10.5" fill="#374151">Calendly booking</text>
    <rect x="177" y="64" width="129" height="34" rx="17" fill="#ffffff" stroke="#d1d5db"/>
    <text x="241" y="85" text-anchor="middle" font-size="10.5" fill="#374151">Slack brief</text>
    <rect x="314" y="64" width="129" height="34" rx="17" fill="#ffffff" stroke="#d1d5db"/>
    <text x="378" y="85" text-anchor="middle" font-size="10.5" fill="#374151">Notion page</text>
    <rect x="451" y="64" width="129" height="34" rx="17" fill="#ffffff" stroke="#d1d5db"/>
    <text x="515" y="85" text-anchor="middle" font-size="10.5" fill="#374151">Console</text>
    <rect x="588" y="64" width="129" height="34" rx="17" fill="#ffffff" stroke="#d1d5db"/>
    <text x="652" y="85" text-anchor="middle" font-size="10.5" fill="#374151">Approval card</text>

    <!-- band B: the harness -->
    <rect x="20" y="140" width="720" height="196" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="40" y="167" font-size="9.5" letter-spacing="1.4" font-weight="600" fill="#9ca3af">THE HARNESS</text>
    <text x="720" y="167" text-anchor="end" font-size="10" fill="#6b7280">what makes it safe to be wrong</text>

    <rect x="40" y="184" width="129" height="96" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="52" y="208" font-size="11" font-weight="600" fill="#111827">Event log</text>
    <text x="52" y="228" font-size="9.5" fill="#6b7280">every input and action</text>
    <text x="52" y="241" font-size="9.5" fill="#6b7280">a row, append-only,</text>
    <text x="52" y="254" font-size="9.5" fill="#6b7280">with a dedupe key</text>

    <rect x="177" y="184" width="129" height="96" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="189" y="208" font-size="11" font-weight="600" fill="#111827">Numbers</text>
    <text x="189" y="228" font-size="9.5" fill="#6b7280">hours, prices and fit</text>
    <text x="189" y="241" font-size="9.5" fill="#6b7280">computed in code, not</text>
    <text x="189" y="254" font-size="9.5" fill="#6b7280">written by the model</text>

    <rect x="314" y="184" width="129" height="96" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="326" y="208" font-size="11" font-weight="600" fill="#111827">Evidence</text>
    <text x="326" y="228" font-size="9.5" fill="#6b7280">the sentence, the</text>
    <text x="326" y="241" font-size="9.5" fill="#6b7280">screenshot, and the</text>
    <text x="326" y="254" font-size="9.5" fill="#6b7280">page it could not read</text>

    <rect x="451" y="184" width="129" height="96" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="463" y="208" font-size="11" font-weight="600" fill="#111827">Tiers</text>
    <text x="463" y="228" font-size="9.5" fill="#6b7280">read, write or draft;</text>
    <text x="463" y="241" font-size="9.5" fill="#6b7280">one approval, one</text>
    <text x="463" y="254" font-size="9.5" fill="#6b7280">draft, used once</text>

    <rect x="588" y="184" width="129" height="96" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="600" y="208" font-size="11" font-weight="600" fill="#111827">Instructions</text>
    <text x="600" y="228" font-size="9.5" fill="#6b7280">versioned by the</text>
    <text x="600" y="241" font-size="9.5" fill="#6b7280">operator, never by</text>
    <text x="600" y="254" font-size="9.5" fill="#6b7280">the agent</text>

    <text x="40" y="312" font-size="9.5" font-style="italic" fill="#9ca3af">No token count, no prompt and no stack trace crosses this line.</text>

    <!-- band C: the model -->
    <rect x="20" y="354" width="720" height="106" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="40" y="381" font-size="9.5" letter-spacing="1.4" font-weight="600" fill="#9ca3af">THE MODEL</text>
    <text x="720" y="381" text-anchor="end" font-size="10" fill="#6b7280">what is allowed to be wrong</text>
    <text x="40" y="406" font-size="10" fill="#374151">Writes the prose, chooses the tools, reads page text as data rather than instruction.</text>
    <text x="40" y="428" font-size="10" fill="#374151">Never types an hour or a price, never holds a credential that can send.</text>
    <text x="40" y="448" font-size="9.5" font-style="italic" fill="#9ca3af">Swappable: a config change, a different provider, or someone else's loop.</text>
  </g>
</svg>
